<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings AI Logic Tester</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: #1a1d2d;
            --accent: #FFD700;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* Prevent body scroll, use panel scrolls */
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: 100%;
        }
        .panel {
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allow panels to scroll internally if too long */
            max-height: 100%;
        }
        h2 { margin-top: 0; color: var(--accent); font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .config-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            background: #0f111a;
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 5px;
            box-sizing: border-box;
        }
        textarea {
            max-height: 150px; /* Prevent textarea from pushing send button off-screen */
            overflow-y: auto;
        }
        button {
            background: var(--accent);
            color: black;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            flex-shrink: 0;
        }
        button:hover { opacity: 0.9; }
        
        #chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f111a;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .msg.user { align-self: flex-end; background: #3b82f6; color: white; }
        .msg.ai { align-self: flex-start; background: #334155; color: var(--text-main); border-left: 3px solid var(--accent); }
        .msg.system { align-self: center; background: transparent; color: var(--text-muted); font-size: 11px; font-style: italic; }

        .input-area { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- SETTINGS PANEL -->
    <div class="panel">
        <h2>🛠 Config</h2>
        
        <div class="config-group">
            <label>API Environment</label>
            <select id="apiEnv">
                <option value="live">LIVE (WingsLashes.com)</option>
                <option value="orb">ORB (Local)</option>
            </select>
        </div>

        <div class="config-group">
            <label>Staff Token (Session)</label>
            <input type="password" id="staffToken" placeholder="Paste Staff Token here...">
        </div>

        <div class="config-group">
            <label>AI Model</label>
            <select id="modelSelect">
                <option value="2.0">Gemini 2.0 Flash (Recommended)</option>
                <option value="2.5">Gemini 2.5 Flash</option>
            </select>
        </div>

        <div class="config-group">
            <label>Gemini API Key</label>
            <input type="text" id="geminiKey" placeholder="Paste Gemini API Key...">
        </div>

        <div class="config-group">
            <label>Client Info (Mock)</label>
            <input type="text" id="clientName" value="Danny Tester">
            <input type="text" id="clientPhone" placeholder="090..." value="0901234567">
        </div>

        <button id="saveConfig">💾 Save Config</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <button id="clearChat" style="background:#ef4444; color:white; margin-top:0; flex:1;">🗑 Clear Chat</button>
            <button id="newSessionBtn" style="background:#3b82f6; color:white; margin-top:0; flex:1;">✨ New Session</button>
        </div>
    </div>

    <!-- CHAT INTERFACE -->
    <div class="panel">
        <h2>🤖 Wings AI Direct Ask</h2>
        <div id="chat-history">
            <div class="msg system">Ready to test. Type a query below.</div>
        </div>
        <div class="input-area" style="align-items: flex-end; flex-shrink: 0;">
            <textarea id="queryInput" placeholder="Hỏi Lola (Enter để gửi, Shift+Enter để xuống dòng)..." rows="2"></textarea>
            <button id="sendBtn" style="width: 80px; margin-top:0; height: 40px;">Send</button>
        </div>
    </div>
</div>

<script src="mock-chrome.js"></script>
<script src="wings-logic.js"></script>
<script src="app.js"></script>

</body>
</html>
